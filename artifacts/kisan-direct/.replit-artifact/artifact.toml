kind = "web"
previewPath = "/"
title = "KisanDirect"
version = "1.0.0"
id = "artifacts/kisan-direct"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21034

[services.development]
run = "pnpm --filter @workspace/kisan-direct run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kisan-direct", "run", "build" ]
publicDir = "artifacts/kisan-direct/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21034"
BASE_PATH = "/"
